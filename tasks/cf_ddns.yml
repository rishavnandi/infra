---
- name: Deploy cloudflare ddns container
  community.docker.docker_container:
    name: "cf_ddns"
    image: "ghcr.io/hotio/cloudflareddns"
    restart_policy: "unless-stopped"
    env:
      PUID: 1000
      PGID: 1000
      UMASK: 002
      TZ: "Asia/Kolkata"
      INTERVAL: 300
      DETECTION_MODE: "dig-whoami.cloudflare"
      LOG_LEVEL: 1
      CF_USER: "{{ cloudflare_email }}"
      CF_APIKEY: "{{ cloudflare_api_key }}"
      CF_HOSTS: "{{ domain }}"
      CF_ZONES: "{{ domain }}"
      CF_RECORDTYPES: "A"
    volumes:
      - "{{ docker_dir }}/cloudflareddns:/config"
