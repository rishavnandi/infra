---
- name: Add required permissions to data and docker_apps directories
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"
  loop:
    - "{{ docker_dir }}"
    - "{{ data_dir }}"

- name: Make sure traefik acme.json permissions are correct
  ansible.builtin.file:
    path: "{{ docker_dir }}/traefik/data/acme.json"
    state: touch
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"

- name: Make sure matrix directory permissions are correct
  ansible.builtin.file:
    path: "{{ docker_dir }}/matrix"
    state: directory
    recurse: true
    owner: 991
    group: 991
    mode: "0755"

- name: Make sure mautrix directory permissions are correct
  ansible.builtin.file:
    path: "{{ docker_dir }}/mautrix_whatsapp"
    state: directory
    recurse: true
    owner: 1337
    group: 1337
    mode: "0755"
